# Render Blueprint: https://render.com/docs/blueprint-spec
# Dashboard -> New -> Blueprint -> pick this repository.
services:
  - type: web
    name: spherex-time-machine
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/targets
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
